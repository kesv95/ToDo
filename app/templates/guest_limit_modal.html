<!-- 비회원 이용 횟수 초과 안내 모달 -->
<div id="guestLimitModal" class="guest-modal">
    <div class="guest-modal-content">
        <button
            type="button"
            class="guest-modal-close"
            onclick="closeGuestLimitModal()"
            aria-label="닫기"
        >&times;</button>

        <h2>회원으로 더 많은 기능을 이용해 보세요!</h2>

        <p>
            비회원은 학습 진단을 1회만 이용할 수 있습니다.
        </p>
        <p>
            구글 로그인 후에는 학습 기록이 DB에 저장되어
            다음 방문에도 자신의 이용 이력을 확인할 수 있습니다.
        </p>

        <a href="{{ url_for('auth.google_login') }}"
           class="guest-login-button">
            Google 로그인
        </a>

        <button
            type="button"
            class="guest-cancel-button"
            onclick="closeGuestLimitModal()"
        >
            나중에 하기
        </button>
    </div>
</div>

<style>
.guest-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.55);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.guest-modal-content {
    position: relative;
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
    padding: 32px 24px;
    border-radius: 14px;
    background: #fff;
    color: #333;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
}

.guest-modal-content h2 {
    margin: 8px 0 18px;
    font-size: 22px;
}

.guest-modal-content p {
    line-height: 1.7;
    font-size: 14px;
}

.guest-modal-close {
    position: absolute;
    top: 8px;
    right: 14px;
    border: none;
    background: none;
    font-size: 28px;
    cursor: pointer;
}

.guest-login-button,
.guest-cancel-button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.guest-login-button {
    background: #4285f4;
    color: white;
    text-decoration: none;
    border: none;
}

.guest-cancel-button {
    background: #f2f2f2;
    color: #333;
    border: none;
}
</style>

<script>
function closeGuestLimitModal() {
    document.getElementById("guestLimitModal").style.display = "none";
}

document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);

    if (params.get("guest_limit") === "1") {
        const modal = document.getElementById("guestLimitModal");

        if (modal) {
            modal.style.display = "flex";
        }

        // URL에서 안내용 파라미터 제거
        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );
    }
});
</script>
