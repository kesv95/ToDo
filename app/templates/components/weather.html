<section class="card">
    <h2>🌤️ 현재 날씨 조회</h2>

    <form action="/weather" method="post">
        <label for="city">도시 이름</label>

        <select id="city" name="city" required>
            <option value="" selected disabled>도시를 선택해 주세요</option>
            <option value="Gangwon">강원</option>
            <option value="Seoul">서울</option>
            <option value="Gyeonggi">경기</option>
            <option value="Sejong">세종</option>
            <option value="Daejeon">대전</option>
            <option value="Jeolla">전라</option>
            <option value="Gyeongsang">경상</option>
            <option value="Busan">부산</option>
            <option value="Jeju">제주</option>
            <option value="Hokkaido">홋카이도</option>
            <option value="Tokyo">도쿄</option>
            <option value="Nagoya">나고야</option>
            <option value="Osaka">오사카</option>
            <option value="Washington">워싱턴</option>
            <option value="New York">뉴욕</option>
            <option value="Chicago">시카고</option>
            <option value="Texas">텍사스</option>
            <option value="Edinburgh">에든버러</option>
            <option value="London">런던</option>
            <option value="Manchester">맨체스터</option>
            <option value="Paris">파리</option>
            <option value="Nice">니스</option>
            <option value="Marseille">마르세유</option>
        </select>

        <button type="submit">날씨 확인</button>
    </form>

    {% if weather %}
    <div class="result">
        <h3>{{ city }}의 현재 날씨</h3>
        <p>🌡️ 기온: {{ weather.temperature }}°C</p>
        <p>💧 습도: {{ weather.humidity }}%</p>
        <p>☁️ 날씨: {{ weather.description }}</p>
        <p>💨 풍속: {{ weather.wind }} km/h</p>
    </div>
    {% endif %}

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
</section>
